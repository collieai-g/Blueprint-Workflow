<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint Workflow — Turn real work into reusable methods.</title>
  <desc id="desc">A charcoal, warm ivory and muted gold brand cover with the original Blueprint Studio square-and-dot mark. Abstract layers illustrate a method emerging from real work; this is a concept graphic, not a product interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0e10"/><stop offset="1" stop-color="#20201e"/></linearGradient>
    <radialGradient id="light" cx=".78" cy=".48" r=".66"><stop stop-color="#9c783b" stop-opacity=".22"/><stop offset="1" stop-color="#0d0e10" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfc48b"/><stop offset="1" stop-color="#8d7447"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#ddd1bb" stroke-opacity=".045"/></pattern>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#302c24"/><stop offset="1" stop-color="#171716"/></linearGradient>
  </defs>
  <rect width="1280" height="460" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="18" fill="url(#light)"/>
  <rect width="1280" height="460" rx="18" fill="url(#grid)"/>
