    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#85eedb"/><stop offset="1" stop-color="#477f99"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b0d8df" stroke-opacity=".045"/></pattern>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b4054"/><stop offset="1" stop-color="#0a2234"/></linearGradient>
  </defs>
